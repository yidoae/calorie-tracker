# Runs on every pull request and every push to master: unit tests, types, lint and a production
# build. The same commands the project asks for before a change is done (see CLAUDE.md).
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SQLite file next to prisma/schema.prisma; created by the migrate step below.
      DATABASE_URL: file:./ci.db
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (also runs prisma generate)
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
