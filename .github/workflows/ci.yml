# Runs on every pull request and every push to master: types, lint, unused code (knip) and the
# @calorie/core tests. The pgTAP database tests (supabase/tests/database) run in their own job only
# when the SUPABASE_DB_URL secret is set, so forks without secrets still pass. Every test file rolls
# back, so running them against the dev project leaves nothing behind.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Core tests
        run: npm test -w @calorie/core

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_DB_URL != ''
      - name: pgTAP tests against the dev project
        if: env.SUPABASE_DB_URL != ''
        run: npx --yes supabase test db --db-url "$SUPABASE_DB_URL"
