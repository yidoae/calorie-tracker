# Runs on every pull request and every push to master: types, lint, unused code (knip) and the
# unit tests of every workspace (@calorie/core, the app's pure helpers, tools/fooddata), the Edge Function
# tests (Deno) and the food-list
# check (committed list outputs match their sources). The pgTAP database tests (supabase/tests/database) run in their own job only
# when the SUPABASE_DB_URL secret is set, so forks without secrets still pass. Every test file rolls
# back, so running them against the dev project leaves nothing behind.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Unit tests (core, mobile and the food pipeline)
        run: npm test
      - name: Food list is built from its sources
        run: npm run check -w fooddata
      - name: Text preview scores at least 90 % on the phrase set (003)
        run: npm run eval:text -w aieval
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function tests (Deno)
        run: npm run test:functions -w @calorie/db

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_DB_URL != ''
      - name: pgTAP tests against the dev project
        if: env.SUPABASE_DB_URL != ''
        run: npx --yes supabase@2.120.0 test db --db-url "$SUPABASE_DB_URL"
