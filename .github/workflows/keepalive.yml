# Supabase pauses a free project after a week without activity. Every three days this sends one
# request with the publishable key (repository variables SUPABASE_URL and SUPABASE_KEY, the same
# values the app ships) that Postgres answers. The anon role may not read foods, so Postgres replies
# 401 permission denied (42501): that is the expected answer and proves the database is awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the dev project
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          body=$(curl -sS --max-time 30 "$SUPABASE_URL/rest/v1/foods?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "$body"
          echo "$body" | grep -q '"code":"42501"'
