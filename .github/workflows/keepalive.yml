# Supabase pauses a free project after a week without activity. Pings that Postgres refused
# (42501, anon reading foods) did not count: the project paused on 2026-11-03 after pings on
# 10-28, 10-31 and 11-01. So each run calls public.keepalive() (migration 20261103190000), the
# one RPC anon may call, which returns true. The publishable key comes from the repository
# variables SUPABASE_URL and SUPABASE_KEY, the same values the app ships.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call keepalive on the dev project
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          body=$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          [ "$body" = "true" ] || { echo "unexpected answer: $(echo "$body" | grep -o '"code":"[^"]*"')"; exit 1; }
